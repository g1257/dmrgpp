name: CI - Ubuntu 24.04 MPI

on:
  push:
    branches:
  pull_request:
    branches:
      - master

jobs:
  build:
    name: RelWithDebInfo (MPI)
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        path: source

    - name: Set up Spack
      uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3 # v3.0.0
      with:
        ref: develop      # Spack version (examples: develop, releases/v0.23)
        buildcache: true  # Configure oci://ghcr.io/spack/github-actions-buildcache
        color: true       # Force color output (SPACK_COLOR=always)
        path: spack       # Where to clone Spack

    - name: Install Dependencies
      run: |
        spack -e ${{github.workspace}}/source install

    - name: Configure
      shell: spack-bash {0}
      run: |
        spack env activate ${{github.workspace}}/source
        cmake -S ${{github.workspace}}/source \
              -B ${{github.workspace}}/build \
              -GNinja \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_COMPILE_WARNING_AS_ERROR=ON \
              -DCMAKE_REQUIRE_FIND_PACKAGE_Kokkos=ON \
              -DCMAKE_REQUIRE_FIND_PACKAGE_KokkosKernels=ON \
              -DDMRGPP_USE_MPI=ON

    - name: Build MPI Targets
      # CTest's MPI label includes the cincuenta solver and its check_value
      # post-processing helper in addition to the dmrg executables.
      run: cmake --build ${{github.workspace}}/build --target dmrg omegas cincuenta check_value

    - name: Test MPI
      run: ctest --test-dir ${{github.workspace}}/build -L MPI --output-on-failure
